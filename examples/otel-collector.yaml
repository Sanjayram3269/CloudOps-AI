# Optional OpenTelemetry Collector configuration.
# When the collector runs in the same Docker Compose network as the API,
# the exporter endpoint is http://api:8000 (the OTLP/HTTP exporter appends /v1/logs).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s
    send_batch_size: 128

exporters:
  otlphttp/cloudops:
    endpoint: http://api:8000
    compression: gzip
    timeout: 10s

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/cloudops]
